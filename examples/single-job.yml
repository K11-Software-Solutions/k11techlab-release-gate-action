# Tests and the gate in one job: the simplest setup.
# Needs .qa-mcp/release-policy.yaml with `required: [junit]` (the built-in policy requires API functional tests).
name: Release gate
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - name: Tests (JUnit XML is evidence)
        run: pytest --junitxml=test-results/junit.xml
        continue-on-error: true          # let the gate decide, with the reasons, instead of a bare red X
      - uses: K11-Software-Solutions/k11techlab-release-gate-action@v1
