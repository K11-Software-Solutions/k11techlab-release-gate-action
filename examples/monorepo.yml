# One gate per service in a monorepo, each with its own policy and evidence.
name: Release gate
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [orders, payments]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: services/${{ matrix.service }}
      - uses: K11-Software-Solutions/k11techlab-release-gate-action@v1
        with:
          working-directory: services/${{ matrix.service }}
          label: ${{ matrix.service }} PR #${{ github.event.pull_request.number }}
          comment: false        # one comment per PR would be overwritten by each service; use the job summary
