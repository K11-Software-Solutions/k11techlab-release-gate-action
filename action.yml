name: "k11 Release Gate"
description: "One deterministic release decision from your QA evidence: ship, ship with conditions, needs a named person, or block."
author: "K11 Software Solutions"
branding:
  icon: "shield"
  color: "green"

inputs:
  base:
    description: "Base ref to diff against, so evidence the change triggers is required too. 'auto' = the pull request's base branch (none on push); 'none' turns it off."
    default: "auto"
  label:
    description: "Release name shown in the report. Default: 'PR #<n>' on pull requests, the tag on tag pushes, else the short commit."
    default: ""
  policy:
    description: "Release policy file. Default: .qa-mcp/release-policy.yaml, or built-in defaults when it doesn't exist."
    default: ""
  fail-on:
    description: "Fail the job at this verdict or worse: block (default), needs-human, conditions, or never."
    default: "block"
  working-directory:
    description: "Project folder (where .qa-mcp/ and the evidence are)."
    default: "."
  comment:
    description: "Post the decision as a pull request comment, updated in place on every run (needs pull-requests: write)."
    default: "true"
  upload:
    description: "Upload release-decision.md and .json as a workflow artifact."
    default: "true"
  version:
    description: "k11-release-gate-mcp version from PyPI."
    default: "0.4.0"
  python-version:
    description: "Python used to run the gate."
    default: "3.12"
  github-token:
    description: "Token for the pull request comment."
    default: ${{ github.token }}

outputs:
  verdict:
    description: "ship | ship_with_conditions | needs_human | block"
    value: ${{ steps.gate.outputs.verdict }}
  blockers:
    description: "Number of blocking findings"
    value: ${{ steps.gate.outputs.blockers }}
  needs-human:
    description: "Number of findings that need a named person"
    value: ${{ steps.gate.outputs.needs-human }}
  conditions:
    description: "Number of conditions to ship with"
    value: ${{ steps.gate.outputs.conditions }}
  decision-json:
    description: "Path to release-decision.json (the audit record)"
    value: ${{ steps.gate.outputs.decision-json }}
  decision-markdown:
    description: "Path to release-decision.md"
    value: ${{ steps.gate.outputs.decision-markdown }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install k11 Release Gate
      shell: bash
      run: python -m pip install --disable-pip-version-check -q "k11-release-gate-mcp==${{ inputs.version }}"

    - name: Evaluate the release
      id: gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_LABEL: ${{ inputs.label }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_COMMENT: ${{ inputs.comment }}
        GH_BASE_REF: ${{ github.base_ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python "${{ github.action_path }}/gate.py"

    - name: Upload the decision
      if: ${{ always() && inputs.upload == 'true' && steps.gate.outputs.decision-json != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: release-decision
        path: |
          ${{ steps.gate.outputs.decision-json }}
          ${{ steps.gate.outputs.decision-markdown }}
        if-no-files-found: ignore

    - name: Enforce the verdict
      shell: bash
      env:
        VERDICT: ${{ steps.gate.outputs.verdict }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: python "${{ github.action_path }}/gate.py" --enforce
